name: Application CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: make lint-ui
      - run: make test-ui

  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.7.2
          args: --timeout=3m

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - run: npm ci
      - run: go install github.com/joho/godotenv/cmd/godotenv

      - run: |
          mkdir -p ./dist
          make test-server

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fider_test
          POSTGRES_PASSWORD: fider_test_pw
          POSTGRES_DB: fider_test
        ports:
          - 5566:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      minio:
        image: getfider/minio:0.0.2
        ports:
          - 9000:9000
        env:
          MINIO_ACCESS_KEY: s3user
          MINIO_SECRET_KEY: s3user-s3cr3t

  container-image:
    needs: [frontend-checks, backend-checks, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t fider-app-image:${{ github.sha }} .
      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 
        with:
          image-ref: fider-app-image:${{ github.sha }}
          format: table
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push scanned image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag "fider-app-image:$IMAGE_TAG" "$ECR_REGISTRY/fider-app:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/fider-app:$IMAGE_TAG"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan repository for secrets with Trivy
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          skip-files: 'etc/dev-fider-io.key,public/services/jwt.spec.ts'
          format: table
          exit-code: '1'